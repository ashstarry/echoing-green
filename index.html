<div id="world" aria-label="纸雕小镇实时三维画面"></div>
<header><div><span class="eyebrow">借风町 · 微观世界</span><h1 title="今宵，把心情说给小镇听。">今宵</h1><p>说一句话，让小镇回应你。</p></div><nav><button id="language" type="button">English</button><button id="sound" aria-pressed="true">声音开</button><button id="pause">暂停</button><button id="resetView">回到全景</button><button id="inspect">小镇手记</button></nav></header>
<div id="loading" role="status"><span class="spinner"></span><h2>正在展开纸雕小镇</h2><p id="loadText">准备模型、纸张与灯火…</p></div>
<aside id="panel" hidden><button id="closePanel" aria-label="关闭手记">×</button><h2>小镇手记</h2><label for="actorPicker">看看谁的日常</label><select id="actorPicker"><option value="">整个小镇</option></select><p id="selection">点一下小镇里的居民或物件。</p><div id="actions"></div><p><a href="./assets/action-list.html" target="_blank" rel="noopener" style="color:#dfb879;font-size:12px">查看完整动作总表 ↗</a></p><h3>正在发生</h3><div id="events"></div><details><summary>画面清晰度</summary><p><button data-quality="smooth">流畅</button> <button data-quality="fine">细腻</button></p><p class="scope-note">两档保持同样的模型、光影与动作。</p></details><details id="nameNote"><summary>关于名字</summary><p>Koyoi，今宵。名字取自日语「今宵」，意思是今夜。晚风、灯火与街坊的日常，组成一个会回应你话语的小世界。</p><p><a href="https://kotobank.jp/word/今宵-505038" target="_blank" rel="noopener">读一读“今宵” ↗</a></p></details><details><summary>运行检查</summary><pre id="diagnostics"></pre></details></aside>
<div id="toast" role="status" aria-live="polite"></div>
<footer><form id="poemForm"><label for="poem">想给小镇带来什么？</label><div class="inputRow"><div class="wishInput"><input id="poem" autocomplete="off" maxlength="600" placeholder="比如：让风慢一点，留一盏灯等晚归的人。"><button id="rerollWish" class="wish-reroll" type="button" aria-label="换一句灵感" title="换一句灵感" hidden><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M19.2 8a7.8 7.8 0 1 0 .3 7M19.2 8V3.8M19.2 8H15" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><button id="send" type="submit">寄给小镇</button></div></form><div class="examples"><button data-wish="dawn">借一缕晨光</button><button data-wish="snow">看纸雪飘落</button><button data-wish="market">逛逛晚市</button><button data-wish="festival">等一场花火</button></div><div class="undoRow"><button id="undo" disabled title="恢复上一组意愿，已经走过的路不会倒带">撤回刚才的变化</button></div><div class="status"><span id="mode">本地小镇 · 加载中</span><span id="saveStatus">网页关闭后暂停</span></div></footer>
