<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>言外 · 动作总表</title><style>body{margin:0;background:#28252e;color:#f0e2cc;font:15px/1.65 system-ui}main{max-width:1150px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center}button,input{font:inherit;color:inherit;background:#38313b;border:1px solid #b99b7055;border-radius:7px;padding:8px 12px}a{color:#e4bd83}table{border-collapse:collapse;width:100%;margin:20px 0}td,th{text-align:left;vertical-align:top;padding:12px;border-bottom:1px solid #ffffff18}small{color:#aaa;display:block;font-size:10px;overflow-wrap:anywhere}#search{width:min(100%,440px)}.scroll{overflow:auto}@media(max-width:600px){main{padding:16px}td,th{padding:8px}h1{font-size:24px}}</style><main><header><h1 id="heading"></h1><button id="language">English</button></header><p id="intro"></p><p><a href="../" id="back"></a> · <a href="./动作总表.csv" id="csv" download></a></p><section><h2 id="paperHeading"></h2><p id="paperIntro"></p></section><input id="search"><div class="scroll"><table><thead><tr id="columns"></tr></thead><tbody id="rows"></tbody></table></div></main><script type="module">
import{getLocale,setLocale,onLocaleChange,t}from'../src/i18n.mjs?v=cp45-responsive-episodes-e28490733a86';
const data=await fetch('./action-inventory.json').then(r=>r.json()),search=document.querySelector('#search');
function render(){const en=getLocale()==='en';document.documentElement.lang=en?'en':'zh-CN';document.title=en?'Echoing Green — Action catalog':'言外 · 动作总表';document.querySelector('#language').textContent=en?'中文':'English';document.querySelector('#heading').textContent=en?'Actions in Echoing Green':'言外 · 已实现动作总表';document.querySelector('#intro').textContent=en?'32 residents. 56 distinct behavior goals, including 8 connected sequences built from existing actions. Movement remains limited to each resident’s available routes. Object controls are listed separately; they are not extra animation clips.':'32位居民，56类行为目标，含8种复用已有动作的连贯片段。移动仍限于各人的可达路线；物件控制单列，不算成额外动画片段。';document.querySelector('#back').textContent=en?'← Return to the town':'← 回到小镇';document.querySelector('#csv').textContent=en?'Source CSV (Chinese)':'下载 CSV';document.querySelector('#paperHeading').textContent=en?'Reusable neighborhood actions':'可复用的街坊动作';document.querySelector('#paperIntro').textContent=en?'26 shared operations and 27 recipes now support paper notes, homecomings, preparations, reopening, planting, tea and snacks, lending umbrellas, sweeping leaves, keepsakes and laundry. A parcel can ride the tram and be handed to a neighbor. The little cloud moves and rains locally; the existing boat travels inside the pond and returns. Keepsakes are limited to six, hanging cloths to two. These are reusable state-driven flows, not a separate animation for every possible wish.':'26种共享基础操作、27种流程，支持纸笺、迎接、筹备、重开、花草、茶点、借伞、扫叶、纪念与晾晒。包裹实际随电车往返并交接；小云移动并局部降雨；原有小船在池塘内离岸再回泊。纪念物最多6件，晾晒布最多2块。流程复用相同行为与绑定，不是每句愿望各做一段独立动画。';search.placeholder=en?'Search a resident, object or action':'搜索人物、物件或动作';document.querySelector('#columns').replaceChildren(...(en?['Resident / object','Actions','What can happen']:['人物 / 组件','数量','可以做什么']).map(s=>{const e=document.createElement('th');e.textContent=s;return e;}));const rows=document.querySelector('#rows');rows.replaceChildren();for(const x of [...data.residents,...data.objects]){const tr=document.createElement('tr');tr.dataset.search=(x.label+' '+x.id+' '+x.actions.map(a=>a.label).join(' ')+' '+t(x.label)+' '+x.actions.map(a=>t(a.label)).join(' ')).toLowerCase();const name=document.createElement('td');name.textContent=en?t(x.label):x.label;const small=document.createElement('small');small.textContent=x.id;name.append(small);const n=document.createElement('td');n.textContent=x.action_count;const actions=document.createElement('td');actions.textContent=x.actions.map(a=>en?t(a.label):a.label).join(' · ');tr.append(name,n,actions);rows.append(tr);}filter();}
function filter(){const q=search.value.toLowerCase().trim();for(const row of document.querySelectorAll('#rows tr'))row.hidden=!!q&&!row.dataset.search.includes(q);}
search.oninput=filter;document.querySelector('#language').onclick=()=>setLocale(getLocale()==='zh'?'en':'zh');onLocaleChange(render);render();
</script></html>
